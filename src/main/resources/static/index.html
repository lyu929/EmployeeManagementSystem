<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Z · Employee Management</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Company Z · Employee Management</h1>
    <div id="session" hidden><span id="who"></span> <button id="logout" type="button">Log out</button></div>
  </header>

  <main>
    <section id="login-view" class="card narrow">
      <h2>Sign in</h2>
      <form id="login-form">
        <label>Username <input name="username" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit" class="primary">Sign in</button>
        <p class="hint">Demo (dev profile): <code>admin</code> / <code>admin123</code>, or <code>snoopy</code> / <code>emp123</code>.</p>
      </form>
    </section>

    <section id="admin-view" hidden>
      <nav class="tabs" role="tablist">
        <button data-tab="employees" class="active" type="button">Employees</button>
        <button data-tab="salary" type="button">Salary adjustment</button>
        <button data-tab="payroll" type="button">Payroll</button>
        <button data-tab="reports" type="button">Reports</button>
        <button data-tab="audit" type="button">Audit log</button>
      </nav>

      <div data-panel="employees" class="panel">
        <div class="card">
          <form id="search-form" class="row">
            <input name="q" placeholder="Search by name or e-mail" aria-label="Search">
            <button type="submit">Search</button>
            <input name="ssn" placeholder="Exact SSN 123-45-6789" aria-label="SSN">
            <button type="button" id="ssn-search">Find by SSN</button>
            <button type="button" id="new-employee" class="primary">New employee</button>
          </form>
          <div class="table-wrap"><table id="employee-table"></table></div>
          <div class="row pager"><button type="button" id="prev">‹ Prev</button><span id="page-info"></span><button type="button" id="next">Next ›</button></div>
        </div>
        <div class="card" id="employee-detail" hidden>
          <h2 id="detail-title"></h2>
          <form id="employee-form" class="grid">
            <label>First name <input name="firstName" required maxlength="65"></label>
            <label>Last name <input name="lastName" required maxlength="65"></label>
            <label>E-mail <input name="email" type="email" required maxlength="120"></label>
            <label>Hire date <input name="hireDate" type="date" required></label>
            <label>Salary <input name="salary" type="number" min="0" step="0.01" required></label>
            <label>SSN <input name="ssn" placeholder="leave empty to keep"></label>
            <label>Division <select name="divisionId"></select></label>
            <label>Job title <select name="jobTitleId"></select></label>
            <div class="row full">
              <button type="submit" class="primary">Save</button>
              <button type="button" id="reveal-ssn">Reveal SSN</button>
              <button type="button" id="delete-employee" class="danger">Delete</button>
              <span id="ssn-out" class="mono"></span>
            </div>
          </form>
          <h3>Pay statements</h3>
          <div class="table-wrap"><table id="detail-pay"></table></div>
        </div>
      </div>

      <div data-panel="salary" class="panel" hidden>
        <div class="card">
          <form id="adjust-form" class="grid">
            <label>Raise (%) <input name="percent" type="number" step="0.01" min="-50" max="100" required value="3"></label>
            <label>Min salary <input name="minSalary" type="number" step="0.01" min="0"></label>
            <label>Max salary <input name="maxSalary" type="number" step="0.01" min="0"></label>
            <label>Division <select name="divisionId"></select></label>
            <div class="row full">
              <button type="submit" name="mode" value="preview">Preview</button>
              <button type="submit" name="mode" value="apply" class="primary">Apply</button>
            </div>
          </form>
          <div class="table-wrap"><table id="adjust-result"></table></div>
        </div>
      </div>

      <div data-panel="payroll" class="panel" hidden>
        <div class="card">
          <form id="payroll-form" class="row">
            <label>Pay date <input name="payDate" type="date" required></label>
            <button type="submit" class="primary">Run payroll</button>
          </form>
          <p id="payroll-out"></p>
        </div>
      </div>

      <div data-panel="reports" class="panel" hidden>
        <div class="card">
          <form id="report-form" class="grid">
            <label>Report
              <select name="kind">
                <option value="payroll">Payroll summary by pay date</option>
                <option value="pay-by-job-title">Total pay by job title (month)</option>
                <option value="pay-by-division">Total pay by division (month)</option>
                <option value="new-hires">New hires in a date range</option>
              </select>
            </label>
            <label>Pay date <input name="payDate" type="date" value="2026-01-31"></label>
            <label>Month <input name="month" type="month" value="2026-01"></label>
            <label>From <input name="from" type="date" value="2022-01-01"></label>
            <label>To <input name="to" type="date" value="2022-12-31"></label>
            <div class="row full"><button type="submit" class="primary">Run report</button></div>
          </form>
          <div class="table-wrap"><table id="report-table"></table></div>
        </div>
      </div>

      <div data-panel="audit" class="panel" hidden>
        <div class="card">
          <div class="row"><button type="button" id="audit-refresh">Refresh</button></div>
          <div class="table-wrap"><table id="audit-table"></table></div>
        </div>
      </div>
    </section>

    <section id="employee-view" hidden>
      <div class="card">
        <h2>My profile</h2>
        <dl id="profile" class="profile"></dl>
      </div>
      <div class="card">
        <h2>My pay statements</h2>
        <div class="table-wrap"><table id="my-pay"></table></div>
      </div>
      <div class="card narrow">
        <h2>Change password</h2>
        <form id="password-form">
          <label>Current password <input name="currentPassword" type="password" required autocomplete="current-password"></label>
          <label>New password (10+ characters) <input name="newPassword" type="password" minlength="10" required autocomplete="new-password"></label>
          <button type="submit" class="primary">Change</button>
        </form>
      </div>
    </section>

    <div id="toast" role="status" hidden></div>
  </main>
  <footer>REST API docs: <a href="swagger-ui.html">Swagger UI</a></footer>
  <script src="app.js"></script>
</body>
</html>
