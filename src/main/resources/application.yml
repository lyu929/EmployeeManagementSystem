spring:
  application:
    name: employee-management
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none              # the schema is owned by Flyway (see db/migration)
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    token-ttl: 30m
    max-login-attempts: 5
    login-lockout: 15m
    # Secrets come from the environment in production (see application-prod.yml / .env.example).
    jwt-secret: ${EMS_JWT_SECRET:}
    ssn-encryption-key: ${EMS_SSN_KEY:}
    ssn-hmac-key: ${EMS_SSN_HMAC_KEY:}
  demo-data:
    enabled: false
    admin-password: admin123
    employee-password: emp123
  bootstrap-admin:
    username: ${EMS_ADMIN_USERNAME:}
    password: ${EMS_ADMIN_PASSWORD:}
